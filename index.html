<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>White Circle Blade</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            touch-action: none;
            font-family: sans-serif;
        }
        
        canvas {
            display: block
        }
        /* MENU */
        
        #menu {
            position: fixed;
            inset: 0;
            background: radial-gradient(#111, #000);
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #menu button {
            padding: 15px 40px;
            font-size: 22px;
            border: none;
            border-radius: 30px;
        }
        /* HUD */
        
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            z-index: 3;
        }
        /* MUSIC BTN */
        
        #musicBtn {
            position: fixed;
            top: 10px;
            right: 10px;
            z-index: 3;
            background: #111;
            color: white;
            padding: 8px 14px;
            border-radius: 20px;
        }
        /* MOBILE CONTROLS */
        
        .joy {
            position: fixed;
            bottom: 30px;
            width: 120px;
            height: 120px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .1);
        }
        
        .knob {
            position: absolute;
            width: 50px;
            height: 50px;
            background: white;
            border-radius: 50%;
            left: 35px;
            top: 35px;
        }
        
        #joyMove {
            left: 20px
        }
        
        #joyAim {
            right: 20px
        }
        
        #attackBtn {
            position: fixed;
            bottom: 180px;
            right: 40px;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: darkred;
            color: white;
            font-size: 30px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 3;
        }
    </style>
</head>

<body tabindex="0">

    <audio id="bgMusic" loop>
    <source src="music.mp3" type="audio/mpeg">
</audio>

    <div id="menu">
        <h1>⚔️ White Circle Blade</h1>
        <button onclick="startGame()">START</button>
    </div>

    <canvas id="game"></canvas>

    <div id="hud">
        ❤️ <span id="hp">100</span><br> ⭐ <span id="score">0</span><br> 🔥 Level <span id="level">1</span>
    </div>

    <div id="musicBtn">🔊</div>

    <div class="joy" id="joyMove">
        <div class="knob"></div>
    </div>
    <div class="joy" id="joyAim">
        <div class="knob"></div>
    </div>
    <div id="attackBtn">⚔️</div>

    <script>
        /* CANVAS */
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");
        canvas.width = innerWidth;
        canvas.height = innerHeight;

        /* MUSIC */
        const bgMusic = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        let musicOn = true;
        musicBtn.onclick = () => {
            musicOn = !musicOn;
            if (musicOn) {
                bgMusic.play();
                musicBtn.innerText = "🔊";
            } else {
                bgMusic.pause();
                musicBtn.innerText = "🔇";
            }
        };

        /* GAME STATE */
        let running = false;
        let score = 0;
        let level = 1;

        /* PLAYER */
        const player = {
            x: canvas.width / 2,
            y: canvas.height / 2,
            r: 15,
            hp: 100,
            angle: 0
        };

        /* ARRAYS */
        let enemies = [];
        let blood = [];
        let hazards = [];

        /* START */
        function startGame() {
            menu.style.display = "none";
            resetGame();
            running = true;
            bgMusic.volume = 0.4;
            bgMusic.play().catch(() => {});
            requestAnimationFrame(loop);
        }

        function resetGame() {
            score = 0;
            level = 1;
            player.hp = 100;
            player.x = canvas.width / 2;
            player.y = canvas.height / 2;
            spawnLevel();
        }

        function spawnLevel() {
            enemies = [];
            hazards = [];
            for (let i = 0; i < level + 3; i++) {
                enemies.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 12,
                    speed: 1 + level * 0.25,
                    hp: 3
                });
            }
            for (let i = 0; i < level; i++) {
                hazards.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: 55
                });
            }
        }

        /* INPUT */
        const keys = {};
        window.addEventListener("keydown", e => {
            keys[e.code] = true;
            if (e.code.startsWith("Arrow") || e.code === "Space") e.preventDefault();
        });
        window.addEventListener("keyup", e => keys[e.code] = false);

        window.addEventListener("mousemove", e => {
            player.angle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
        });

        /* ATTACK */
        function attack() {
            enemies.forEach(e => {
                const dx = e.x - player.x,
                    dy = e.y - player.y;
                const d = Math.hypot(dx, dy);
                const a = Math.atan2(dy, dx);
                if (d < 70 && Math.abs(a - player.angle) < 0.6) {
                    e.hp--;
                    spawnBlood(e.x, e.y, a);
                    if (e.hp <= 0) score += 10;
                }
            });
        }
        window.addEventListener("mousedown", () => running && attack());
        attackBtn.ontouchstart = () => attack();

        /* BLOOD */
        function spawnBlood(x, y, a) {
            for (let i = 0; i < 12; i++) {
                blood.push({
                    x,
                    y,
                    vx: Math.cos(a) + (Math.random() - 0.5) * 2,
                    vy: Math.sin(a) + (Math.random() - 0.5) * 2,
                    life: 25
                });
            }
        }

        /* JOYSTICKS */
        function joystick(el, cb) {
            let active = false,
                sx, sy;
            el.addEventListener("pointerdown", e => {
                active = true;
                sx = e.clientX;
                sy = e.clientY;
            });
            window.addEventListener("pointermove", e => {
                if (!active) return;
                cb(e.clientX - sx, e.clientY - sy);
            });
            window.addEventListener("pointerup", () => active = false);
        }

        joystick(joyMove, (dx, dy) => {
            player.x += dx * 0.03;
            player.y += dy * 0.03;
        });
        joystick(joyAim, (dx, dy) => {
            player.angle = Math.atan2(dy, dx);
        });

        /* LOOP */
        function loop() {
            if (!running) return;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            /* MOVE */
            if (keys.KeyW || keys.ArrowUp) player.y -= 3;
            if (keys.KeyS || keys.ArrowDown) player.y += 3;
            if (keys.KeyA || keys.ArrowLeft) player.x -= 3;
            if (keys.KeyD || keys.ArrowRight) player.x += 3;
            if (keys.Space) attack();

            /* HAZARDS */
            hazards.forEach(h => {
                ctx.beginPath();
                ctx.arc(h.x, h.y, h.r, 0, Math.PI * 2);
                ctx.fillStyle = "rgba(255,0,0,.2)";
                ctx.fill();
                if (Math.hypot(player.x - h.x, player.y - h.y) < h.r) player.hp -= 0.2;
            });

            /* ENEMIES */
            enemies = enemies.filter(e => {
                const dx = player.x - e.x,
                    dy = player.y - e.y;
                const d = Math.hypot(dx, dy) || 1;
                e.x += dx / d * e.speed;
                e.y += dy / d * e.speed;
                if (d < player.r + e.r) player.hp -= 0.3;

                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fillStyle = "crimson";
                ctx.fill();

                return e.hp > 0;
            });

            /* BLOOD DRAW */
            blood = blood.filter(b => {
                b.x += b.vx;
                b.y += b.vy;
                b.vy += 0.1;
                b.life--;

                ctx.beginPath();
                ctx.moveTo(b.x, b.y);
                ctx.lineTo(b.x - b.vx * 2, b.y - b.vy * 2);
                ctx.strokeStyle = "darkred";
                ctx.lineWidth = 2;
                ctx.stroke();

                return b.life > 0;
            });

            /* PLAYER */
            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.beginPath();
            ctx.arc(0, 0, player.r, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.strokeStyle = "silver";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(45, 0);
            ctx.stroke();
            ctx.restore();

            /* LEVEL UP */
            if (enemies.length === 0) {
                level++;
                spawnLevel();
            }

            hp.innerText = Math.floor(player.hp);
            score.innerText = score;
            level.innerText = level;

            if (player.hp <= 0) {
                running = false;
                menu.style.display = "flex";
                bgMusic.pause();
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>

</html>
