<!DOCTYPE html>
<html lang="fa">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>جنگ ما</title>

    <style>
        html,
        body {
            margin: 0;
            padding: 0;
            background: #000;
            overflow: hidden;
            touch-action: none;
            font-family: sans-serif;
        }
        
        canvas {
            display: block
        }
        /* MENU */
        
        #menu {
            position: fixed;
            inset: 0;
            background: #000;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 10;
        }
        
        #menu button {
            padding: 18px 50px;
            font-size: 22px;
            border-radius: 40px;
        }
        /* HUD */
        
        #hud {
            position: fixed;
            top: 10px;
            left: 10px;
            color: white;
            font-size: 16px;
            z-index: 5;
        }
        /* MUSIC */
        
        #musicBtn {
            position: fixed;
            top: 10px;
            right: 10px;
            padding: 10px 16px;
            border-radius: 30px;
            background: #111;
            color: white;
            z-index: 5;
        }
        /* MOBILE CONTROLS */
        
        .joy {
            position: fixed;
            bottom: 20px;
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .08);
        }
        
        .knob {
            position: absolute;
            width: 55px;
            height: 55px;
            background: white;
            border-radius: 50%;
            left: 37px;
            top: 37px;
        }
        
        #joyMove {
            left: 20px
        }
        
        #joyAim {
            right: 20px
        }
        
        #attackBtn {
            position: fixed;
            bottom: 180px;
            right: 45px;
            width: 85px;
            height: 85px;
            border-radius: 50%;
            background: darkred;
            color: white;
            font-size: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }
    </style>
</head>

<body>

    <audio id="bgMusic" loop>
<source src="music.mp3" type="audio/mpeg">
</audio>

    <div id="menu">
        <h1>⚔️ White Circle Blade</h1>
        <p id="record"></p>
        <button onclick="startGame()">START</button>
    </div>

    <canvas id="game"></canvas>

    <div id="hud">
        ❤️ <span id="hp"></span><br> ⭐ <span id="score"></span><br> 🔥 Lvl <span id="level"></span><br> ⚡ Combo <span id="combo"></span>
    </div>

    <div id="musicBtn">🔊</div>

    <div class="joy" id="joyMove">
        <div class="knob"></div>
    </div>
    <div class="joy" id="joyAim">
        <div class="knob"></div>
    </div>
    <div id="attackBtn">⚔️</div>

    <script>
        /* CANVAS */
        const canvas = document.getElementById("game");
        const ctx = canvas.getContext("2d");

        function resize() {
            const dpr = window.devicePixelRatio || 1;
            canvas.width = innerWidth * dpr;
            canvas.height = innerHeight * dpr;
            canvas.style.width = innerWidth + "px";
            canvas.style.height = innerHeight + "px";
            ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
        resize();
        addEventListener("resize", resize);

        /* MUSIC */
        const bgMusic = document.getElementById("bgMusic");
        const musicBtn = document.getElementById("musicBtn");
        let musicOn = true;
        musicBtn.onclick = () => {
            musicOn = !musicOn;
            musicOn ? bgMusic.play() : bgMusic.pause();
            musicBtn.innerText = musicOn ? "🔊" : "🔇";
        };

        /* RECORD */
        let bestScore = localStorage.bestScore || 0;
        let bestLevel = localStorage.bestLevel || 0;
        record.innerText = `🏆 Best Score: ${bestScore} | Best Level: ${bestLevel}`;

        /* GAME */
        let running = false,
            score = 0,
            level = 1,
            combo = 0,
            slow = 1;
        const player = {
            x: innerWidth / 2,
            y: innerHeight / 2,
            r: 15,
            hp: 100,
            spd: 3,
            pow: 1,
            angle: 0
        };
        let enemies = [],
            particles = [];
        let env = ["normal", "snow", "rain", "hell"];

        /* START */
        function startGame() {
            menu.style.display = "none";
            score = 0;
            level = 1;
            combo = 0;
            player.hp = 100;
            player.pow = 1;
            player.spd = 3;
            spawn();
            running = true;
            bgMusic.volume = 0.4;
            bgMusic.play().catch(() => {});
            requestAnimationFrame(loop);
        }

        /* SPAWN */
        function spawn() {
            enemies = [];
            const count = level % 5 === 0 ? 1 : level + 3;
            for (let i = 0; i < count; i++) {
                enemies.push({
                    x: Math.random() * innerWidth,
                    y: Math.random() * innerHeight,
                    r: level % 5 === 0 ? 28 : 12,
                    hp: level % 5 === 0 ? 20 : 3,
                    spd: level % 5 === 0 ? 1.2 : 1 + level * 0.2,
                    boss: level % 5 === 0
                });
            }
        }

        /* INPUT */
        const keys = {};
        addEventListener("keydown", e => keys[e.code] = true);
        addEventListener("keyup", e => keys[e.code] = false);
        addEventListener("mousemove", e => {
            player.angle = Math.atan2(e.clientY - player.y, e.clientX - player.x);
        });

        /* ATTACK */
        function attack() {
            enemies.forEach(e => {
                const dx = e.x - player.x,
                    dy = e.y - player.y;
                const d = Math.hypot(dx, dy);
                const a = Math.atan2(dy, dx);
                if (d < 80 && Math.abs(a - player.angle) < 0.7) {
                    e.hp -= player.pow;
                    combo++;
                    slow = combo % 5 === 0 ? 0.4 : 1;
                    navigator.vibrate(20);
                    for (let i = 0; i < 8; i++) {
                        particles.push({
                            x: e.x,
                            y: e.y,
                            vx: (Math.random() - 0.5) * 4,
                            vy: (Math.random() - 0.5) * 4,
                            l: 20
                        });
                    }
                    if (e.hp <= 0) score += e.boss ? 100 : 10;
                }
            });
        }
        attackBtn.ontouchstart = attack;
        addEventListener("mousedown", () => running && attack());

        /* JOYSTICKS */
        function joystick(el, cb) {
            let act = false,
                sx, sy;
            el.addEventListener("pointerdown", e => {
                act = true;
                sx = e.clientX;
                sy = e.clientY
            });
            addEventListener("pointermove", e => act && cb((e.clientX - sx) / 30, (e.clientY - sy) / 30));
            addEventListener("pointerup", () => act = false);
        }
        joystick(joyMove, (dx, dy) => {
            player.x += dx * player.spd;
            player.y += dy * player.spd
        });
        joystick(joyAim, (dx, dy) => Math.abs(dx) + Math.abs(dy) > 0.2 && (player.angle = Math.atan2(dy, dx)));

        /* LOOP */
        function loop() {
            if (!running) return;
            ctx.clearRect(0, 0, innerWidth, innerHeight);

            /* ENV */
            if (env[level % 4] === "snow") {
                ctx.fillStyle = "rgba(255,255,255,.05)";
                ctx.fillRect(0, 0, innerWidth, innerHeight);
            }
            if (env[level % 4] === "rain") {
                ctx.strokeStyle = "rgba(100,100,255,.2)";
                for (let i = 0; i < 20; i++) {
                    ctx.beginPath();
                    ctx.moveTo(Math.random() * innerWidth, Math.random() * innerHeight);
                    ctx.lineTo(0, 10);
                    ctx.stroke();
                }
            }
            if (env[level % 4] === "hell") {
                ctx.fillStyle = "rgba(255,0,0,.05)";
                ctx.fillRect(0, 0, innerWidth, innerHeight);
            }

            /* MOVE */
            if (keys.KeyW) player.y -= player.spd;
            if (keys.KeyS) player.y += player.spd;
            if (keys.KeyA) player.x -= player.spd;
            if (keys.KeyD) player.x += player.spd;

            enemies = enemies.filter(e => {
                const dx = player.x - e.x,
                    dy = player.y - e.y;
                const d = Math.hypot(dx, dy) || 1;
                e.x += dx / d * e.spd * slow;
                e.y += dy / d * e.spd * slow;
                if (d < player.r + e.r) player.hp -= 0.3;
                ctx.beginPath();
                ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2);
                ctx.fillStyle = e.boss ? "purple" : "crimson";
                ctx.fill();
                return e.hp > 0;
            });

            particles = particles.filter(p => {
                p.x += p.vx;
                p.y += p.vy;
                p.l--;
                ctx.fillStyle = "darkred";
                ctx.fillRect(p.x, p.y, 3, 3);
                return p.l > 0;
            });

            ctx.save();
            ctx.translate(player.x, player.y);
            ctx.rotate(player.angle);
            ctx.beginPath();
            ctx.arc(0, 0, player.r, 0, Math.PI * 2);
            ctx.fillStyle = "white";
            ctx.fill();
            ctx.strokeStyle = "silver";
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.moveTo(0, 0);
            ctx.lineTo(45, 0);
            ctx.stroke();
            ctx.restore();

            if (enemies.length === 0) {
                level++;
                player.hp += 10;
                player.pow += 0.2;
                player.spd += 0.1;
                spawn();
            }

            hp.innerText = Math.floor(player.hp);
            score.innerText = score;
            level.innerText = level;
            combo.innerText = combo;

            slow += 0.02;
            if (slow > 1) slow = 1;

            if (player.hp <= 0) {
                running = false;
                bestScore = Math.max(bestScore, score);
                bestLevel = Math.max(bestLevel, level);
                localStorage.bestScore = bestScore;
                localStorage.bestLevel = bestLevel;
                menu.style.display = "flex";
                record.innerText = `🏆 Best Score: ${bestScore} | Best Level: ${bestLevel}`;
                bgMusic.pause();
            }

            requestAnimationFrame(loop);
        }
    </script>
</body>

</html>
